[package]
name = "squishdb"
version = "0.5.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Single-file embedded SQL database with PAX-v4 columnar pages and lossless per-column compression."
repository = "https://github.com/F1nnD3v/squishdb"
readme = "README.md"
keywords = ["database", "embedded", "sql", "compression", "columnar"]
categories = ["database-implementations", "compression"]

[lib]
name = "squishdb"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
