[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squishdb"
version = "0.4.0a1"
description = "Python bindings (DB-API 2.0 + native bulk API) for SquishDB via ctypes."
readme = "../../README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["database", "embedded", "sql", "compression", "columnar", "squishdb"]

[tool.setuptools.packages.find]
where = ["."]
include = ["squishdb*"]
