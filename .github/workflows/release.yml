name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin: squishdb
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: squishdb.exe
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: squishdb
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: squishdb
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release CLI binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin squishdb

      - name: Smoke test native CLI binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --help

      - name: Package tar.gz archive (Unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="squishdb-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${STAGE}/"
          cp LICENSE README.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - name: Package zip archive (Windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $stage = "squishdb-$($env:GITHUB_REF_NAME)-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$stage/"
          Copy-Item LICENSE, README.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip" -Force
          Remove-Item -Recurse -Force "dist/$stage"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/squishdb-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          LC_ALL=C sha256sum squishdb-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/squishdb-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
